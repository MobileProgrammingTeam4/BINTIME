name: BIN TIME - CI
on:
  pull_request:
    branches: [develop, main]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  automation-tests:
    name: Automation logic tests
    needs: detect-android
    if: ${{ !cancelled() && (needs.detect-android.result != 'success' || needs.detect-android.outputs.automation == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful change detection
        env:
          DETECTION_RESULT: ${{ needs.detect-android.result }}
        run: test "$DETECTION_RESULT" = success
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs

  detect-android:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      directory: ${{ steps.detect.outputs.directory }}
      android: ${{ steps.detect.outputs.android }}
      automation: ${{ steps.detect.outputs.automation }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: detect
        run: node scripts/ci_plan.cjs

  android-build:
    needs: detect-android
    if: ${{ !cancelled() && (needs.detect-android.result != 'success' || needs.detect-android.outputs.android == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require successful change detection
        env:
          DETECTION_RESULT: ${{ needs.detect-android.result }}
        run: test "$DETECTION_RESULT" = success
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble + unit tests + lint
        shell: bash
        env:
          PROJECT_DIR: ${{ needs.detect-android.outputs.directory }}
        run: |
          cd "$PROJECT_DIR"
          bash ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
