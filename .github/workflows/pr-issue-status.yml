name: BIN TIME - PR linked issue status
on:
  pull_request_target:
    branches: [develop]
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  sync-issue-labels:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Trusted integration code; never execute the PR head with write permissions.
          # This entrypoint must also be installed on the default branch (main).
          ref: develop
          persist-credentials: false
      - name: Update related issue status
        uses: actions/github-script@v7
        with:
          script: |
            await require('./scripts/pr_issue_status.cjs').run({ github, context, core });
