name: BIN TIME - PR linked issue status
on:
  pull_request_target:
    types: [opened, reopened, edited, ready_for_review, converted_to_draft, closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  sync-issue-labels:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Update related issue status
        uses: actions/github-script@v7
        with:
          script: |
            await require('./scripts/pr_issue_status.cjs').run({ github, context, core });
