name: BIN TIME - PR to Project status
on:
  pull_request_target:
    branches: [develop]
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  sync-project:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Trusted integration code; never execute the PR head with the Project token.
          # This entrypoint must also be installed on the default branch (main).
          ref: develop
          persist-credentials: false
      - name: Update configured project cards
        uses: actions/github-script@v7
        env:
          BIN_TIME_PROJECT_TOKEN: ${{ secrets.BIN_TIME_PROJECT_TOKEN }}
          BIN_TIME_PROJECT_OWNER: ${{ vars.BIN_TIME_PROJECT_OWNER }}
          BIN_TIME_PROJECT_NUMBER: ${{ vars.BIN_TIME_PROJECT_NUMBER }}
        with:
          github-token: ${{ secrets.BIN_TIME_PROJECT_TOKEN || github.token }}
          script: |
            await require('./scripts/pr_project_status.cjs').run({ github, context, core });
